# XcodeGen spec: the source of truth for the Xcode project. Never edit the generated .xcodeproj (it's gitignored).
# Regenerate after pulling or after adding targets/files:  xcodegen generate
name: {{APP_IDENT}}
options:
  deploymentTarget:
    iOS: "{{IOS_MIN}}"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Modules:
    path: Modules
targets:
  {{APP_IDENT}}:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
        TARGETED_DEVICE_FAMILY: "{{DEVICE_FAMILY}}"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "{{APP_NAME}}"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "{{IPHONE_ORIENTATIONS}}"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - package: Modules
        products: [CoreAnalytics, CoreDataLayer, DesignSystem, FeatureHome]
schemes:
  {{APP_IDENT}}:
    build:
      targets:
        {{APP_IDENT}}: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: Modules/DesignSystemTests
        - package: Modules/FeatureHomeTests
